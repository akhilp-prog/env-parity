[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-parity"
version = "0.1.0"
description = "Compare dotenv keys without printing their values"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0,<2"]
readme = "README.md"

[project.scripts]
env-parity = "env_parity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
